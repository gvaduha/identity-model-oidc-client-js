name: build

# Installs, tests and rebuilds the library. On a push, regenerated lib/, dist/,
# package-lock.json and the conformance copy are committed back to the branch,
# so consumers installing from git get bundles that match src/.

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # webpack 5 / Babel 7 / mocha 11 toolchain; building needs Node >= 20
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm install (not ci) so the lockfile is regenerated after dependency changes
      - run: npm install --no-audit --no-fund

      # Runtime dependencies (what consumers install) must have no known vulnerabilities
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Audit all dependencies
        run: |
          npm audit --json > audit.json || true
          node -e "
            const r = require('./audit.json'); const v = r.vulnerabilities || {};
            for (const [name, x] of Object.entries(v)) {
              const via = x.via.map(e => typeof e === 'string' ? e : e.source + ' ' + e.title).join('; ');
              console.log('::warning title=npm audit ' + x.severity + '::' + name + ' ' + x.range + ' <- ' + via + (x.fixAvailable ? ' (fix available)' : ''));
            }
            console.log('total', JSON.stringify(r.metadata.vulnerabilities));
            if (Object.keys(v).length) process.exit(1);
          "

      - run: npm test

      - run: npm run build

      - name: Check bundle exports
        run: node test/bundle/exports.js

      - name: Refresh conformance test copy
        run: cp dist/oidc-client.js test/conformance/Oidc-Client-Conformance/Oidc-Client-Conformance/oidc-client.js

      - name: Check bundles are free of jsrsasign
        run: |
          if grep -rIn -o -e jsrsasign -e KJUR -e KEYUTIL lib dist test/conformance package-lock.json | head -20 | grep .; then
            echo "jsrsasign found in build output" >&2
            exit 1
          fi
          npm ls crypto-js || true

      - name: Commit regenerated output
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib dist package-lock.json version.js test/conformance
          if git diff --cached --quiet; then
            echo "Build output already up to date"
          else
            git commit -m "Rebuild lib/ and dist/"
            git push
          fi

  # Make sure the toolchain also works on Windows and on the oldest supported Node. No commit here.
  build-current-node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node test/bundle/exports.js
